<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Warm-up · Vocab List 6</title>
<style>
:root{
  --rose:#8C2F39; --rose-d:#6A2029; --mint:#BFE3D0; --mint-l:#E8F5EE;
  --ink:#24171A; --muted:#6E5A5E; --paper:#FFFFFF; --line:#E6D9DB;
  --good:#1E7A4F; --bad:#B3261E;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ar:"Segoe UI",Tahoma,"Geeza Pro",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--mint-l);color:var(--ink);font-family:var(--sans);font-size:19px;line-height:1.5}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:0 18px 48px}
header{background:var(--rose);color:#fff}
header .wrap{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
header h1{font-family:var(--serif);font-size:24px;margin:0;font-weight:700}
header .sp{flex:1}
.wallet{display:flex;align-items:center;gap:10px;background:#fff;color:var(--rose-d);border-radius:10px;padding:6px 14px;font-weight:700}
.note{display:inline-block;width:38px;height:22px;border-radius:3px;background:var(--mint);border:2px solid var(--rose);position:relative}
.note::after{content:"";position:absolute;inset:5px 12px;border-radius:50%;border:2px solid var(--rose)}
nav.steps{display:flex;gap:8px;margin:22px 0 18px;flex-wrap:wrap}
nav.steps button{border:2px solid var(--rose);background:#fff;color:var(--rose);border-radius:999px;padding:6px 16px;font-weight:600;font-size:17px}
nav.steps button[aria-current="true"]{background:var(--rose);color:#fff}
h2{font-family:var(--serif);font-size:32px;margin:6px 0 6px;color:var(--rose-d)}
.lead{color:var(--muted);margin:0 0 20px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{perspective:900px;height:210px;border:0;padding:0;background:none;text-align:left}
.card .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:center;border:2px solid var(--line);background:#fff}
.face.front{align-items:flex-start}
.face.front b{font-family:var(--serif);font-size:30px;color:var(--rose-d)}
.face.front span{color:var(--muted);font-size:16px}
.face.back{transform:rotateY(180deg);background:var(--rose);color:#fff;border-color:var(--rose);font-size:17px;gap:6px;justify-content:flex-start}
.face.back .ar{font-family:var(--ar);font-size:24px;direction:rtl;text-align:right;color:var(--mint)}
.face.back i{opacity:.92}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}}
.panel{background:#fff;border-radius:16px;border:2px solid var(--line);padding:24px}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:16px;margin-bottom:8px}
.bar{height:8px;background:var(--mint-l);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--rose);transition:width .3s}
.prompt{font-size:24px;font-family:var(--serif);margin:4px 0 18px}
.prompt .gap{display:inline-block;min-width:120px;border-bottom:3px solid var(--rose);text-align:center;color:var(--rose)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;text-align:left;font-size:20px;font-weight:600}
.opt:hover{border-color:var(--rose)}
.opt.right{background:#E3F4EA;border-color:var(--good);color:var(--good)}
.opt.wrong{background:#FBE9E7;border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;display:none;font-size:18px}
.fb.show{display:block}
.fb.ok{background:#E3F4EA}
.fb.no{background:#FBE9E7}
.fb .ar{font-family:var(--ar);direction:rtl;display:inline-block;margin-left:6px}
.row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;align-items:center}
.btn{background:var(--rose);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:18px}
.btn.ghost{background:#fff;color:var(--rose);border:2px solid var(--rose)}
.btn:disabled{opacity:.4;cursor:default}
.hintbtn{background:none;border:0;color:var(--rose);text-decoration:underline;font-size:17px;padding:4px}
.hint{font-family:var(--ar);direction:rtl;font-size:22px;color:var(--rose-d);display:none}
.hint.show{display:inline}
/* results + certificate */
.result{text-align:left}
.big{font-family:var(--serif);font-size:64px;color:var(--rose-d);margin:0;line-height:1}
.cert{margin:24px 0;border:6px double var(--rose);border-radius:10px;padding:26px;background:
  repeating-linear-gradient(45deg,#fff 0 12px,#FBF5F6 12px 24px);position:relative}
.cert h3{font-family:var(--serif);font-size:30px;margin:0 0 6px;color:var(--rose-d)}
.cert .who{font-family:var(--serif);font-size:34px;border-bottom:2px solid var(--rose);display:inline-block;padding:0 10px;margin:8px 0}
.cert .sig{margin-top:20px;font-family:var(--serif);font-style:italic}
.cert .seal{position:absolute;right:22px;top:22px;width:84px;height:84px;border-radius:50%;background:var(--mint);border:3px solid var(--rose);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--rose-d);text-align:center;font-size:14px;line-height:1.1}
input[type=text]{border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:min(360px,100%)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:9}
.toast.show{display:block}
footer{text-align:center;color:var(--muted);font-size:15px;padding:24px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:8}
@media print{header,nav,footer,.row,.noprint{display:none!important}body{background:#fff}.cert{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Word Warm-up</h1>
  <span>Vocab List 6 · A Business Between Classes</span>
  <span class="sp"></span>
  <div class="wallet" aria-live="polite"><span class="note" aria-hidden="true"></span><span id="notes">0</span>&nbsp;class notes</div>
</div></header>

<main class="wrap">
  <nav class="steps" aria-label="Rounds">
    <button data-go="study">1 · Study the cards</button>
    <button data-go="r1">2 · Meaning match</button>
    <button data-go="r2">3 · Fill the gap</button>
    <button data-go="end">My result</button>
  </nav>
  <section id="view"></section>
</main>
<footer>Designed by: Nazila Motahari &nbsp;|&nbsp; Higher Colleges of Technology &nbsp;|&nbsp; B1+ Vocabulary List 6 (Fall) — Commerce</footer>
<div class="toast" id="toast" role="status"></div>
<canvas id="cf"></canvas>

<script>
const WORDS=[
 {w:"deposit",ar:"عَربون / دَفعة أولى",d:"part of the price that you pay before you get something",ex:"the customer must pay a deposit of half the price"},
 {w:"label",ar:"مُلصَق / عَلامة تِجاريّة",d:"a small piece of paper or material on a product that gives information about it",ex:"Every bottle carries a gold label with the name of her brand"},
 {w:"trade",ar:"تِجارة",d:"the business of buying and selling things",ex:"who has been in the perfume trade for forty years"},
 {w:"credit",ar:"الدَّفع لاحِقاً / اِئتِمان",d:"a way of buying something now and paying for it later",ex:"Mariam allowed friends to buy on credit and pay later"},
 {w:"owe",ar:"يَدين بِـ",d:"to have to pay money back to someone",ex:"several of them owed her more than 2,000 dirhams in total"},
 {w:"loan",ar:"قَرض",d:"money that someone borrows and must pay back",ex:"she had to take a loan of 3,000 dirhams from her father"},
 {w:"account",ar:"حِساب",d:"an arrangement with a bank to keep your money there",ex:"She must transfer the money to the agency's account in euros"},
 {w:"request",ar:"طَلَب",d:"the act of asking for something politely or formally",ex:"Customers send a request by direct message"},
 {w:"confirm",ar:"يُؤَكِّد",d:"to say or write that something is definitely arranged",ex:"she sends a message to confirm the order"},
 {w:"agency",ar:"وَكالة",d:"a business that provides a service for other people or businesses",ex:"she uses a small agency in Dubai"},
 {w:"in charge of",ar:"مَسؤول عن",d:"responsible for something or someone",ex:"Mariam's mother is in charge of packing"},
 {w:"duty",ar:"واجِب",d:"something you must do because it is right or expected",ex:"My studies are my duty to my family and to myself"}
];
const GAPS={
 deposit:"To book the hall for our graduation party, we paid a ___ of 500 dirhams.",
 label:"Always read the ___ on a perfume bottle before you buy it as a gift.",
 trade:"Dubai has been a centre of ___ between East and West for hundreds of years.",
 credit:"Many young people buy new phones on ___ and then struggle to pay every month.",
 owe:"I borrowed 50 dirhams from Sara for lunch, so I ___ her 50 dirhams.",
 loan:"Some graduates take a ___ from the bank to buy their first car.",
 account:"My scholarship money goes straight into my bank ___ every month.",
 request:"If you need more time for the assignment, send a ___ to your teacher by email.",
 confirm:"Please call the clinic to ___ your appointment for Sunday.",
 agency:"She found her first teaching job through a recruitment ___.",
 "in charge of":"Ms Latifa is ___ the student council, so ask her about the event.",
 duty:"It is every teacher's ___ to keep her students safe."
};
const TYPE={deposit:"n",label:"n",trade:"n",credit:"n",loan:"n",account:"n",request:"n",agency:"n",duty:"n",owe:"v",confirm:"v","in charge of":"a"};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const byW=Object.fromEntries(WORDS.map(x=>[x.w,x]));
function makeOpts(w,sameType){
  let pool=WORDS.map(x=>x.w).filter(x=>x!==w);
  if(sameType){const same=shuffle(pool.filter(x=>TYPE[x]===TYPE[w]));const other=shuffle(pool.filter(x=>TYPE[x]!==TYPE[w]));pool=same.concat(other)}
  else pool=shuffle(pool);
  return shuffle([w].concat(pool.slice(0,3)));
}
function build(){
  return{
    r1:shuffle(WORDS.map(x=>x.w)).map(w=>({w,opts:makeOpts(w,false),pick:null,hint:false})),
    r2:shuffle(WORDS.map(x=>x.w)).map(w=>({w,opts:makeOpts(w,true),pick:null,hint:false})),
    i1:0,i2:0,notes:0,name:""
  };
}
let S=build(),view="study";
const $=s=>document.querySelector(s);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2400)}
function score(){return S.r1.concat(S.r2).filter(q=>q.pick===q.w).length}
function setNotes(){S.notes=S.r1.concat(S.r2).reduce((n,q)=>n+(q.pick===q.w?(q.hint?5:10):0),0);$("#notes").textContent=S.notes}
function go(v){view=v;document.querySelectorAll("nav.steps button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===v));render();window.scrollTo(0,0)}
document.querySelectorAll("nav.steps button").forEach(b=>b.onclick=()=>go(b.dataset.go));

function render(){
  const V=$("#view");
  if(view==="study"){
    V.innerHTML=`<h2>Study the 12 key words</h2><p class="lead">Tap a card to turn it over. You will see the Arabic, a simple meaning, and the sentence from the reading. Then start Round 2.</p>
    <div class="grid">${WORDS.map((x,i)=>`<button class="card" data-i="${i}" aria-label="${x.w}, tap to turn over"><div class="in">
      <div class="face front"><b>${x.w}</b><span>tap to turn over</span></div>
      <div class="face back"><div class="ar" lang="ar">${x.ar}</div><div>${x.d}</div><i>“…${x.ex}…”</i></div></div></button>`).join("")}</div>
    <div class="row"><button class="btn" id="startR1">Start Round 2: Meaning match</button></div>`;
    V.querySelectorAll(".card").forEach(c=>c.onclick=()=>c.classList.toggle("flip"));
    $("#startR1").onclick=()=>go("r1");
    return;
  }
  if(view==="r1"||view==="r2"){
    const key=view, list=S[key], idx=key==="r1"?S.i1:S.i2, q=list[idx], x=byW[q.w];
    const prompt=key==="r1"
      ? `Which word means: <em>${x.d}</em>?`
      : GAPS[q.w].replace("___",`<span class="gap">${q.pick? q.pick : "?"}</span>`);
    V.innerHTML=`<h2>${key==="r1"?"Round 2 · Meaning match":"Round 3 · Fill the gap"}</h2>
    <p class="lead">${key==="r1"?"Read the meaning and choose the word.":"These sentences are about college, work and daily life. Choose the word that fits."} Correct first time = 10 notes. With the Arabic hint = 5 notes.</p>
    <div class="panel">
      <div class="qhead"><span>Question ${idx+1} of ${list.length}</span><span>${list.filter(a=>a.pick===a.w).length} correct so far</span></div>
      <div class="bar"><i style="width:${(idx/list.length)*100}%"></i></div>
      <p class="prompt">${prompt}</p>
      <div class="opts">${q.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}</div>
      <div class="row noprint"><button class="hintbtn" id="hint">Show the Arabic hint</button><span class="hint" id="hintTxt" lang="ar">${x.ar}</span></div>
      <div class="fb" id="fb" aria-live="polite"></div>
      <div class="row"><button class="btn ghost" id="prev" ${idx===0?"disabled":""}>Previous</button><button class="btn" id="next">${idx===list.length-1?(key==="r1"?"Go to Round 3":"See my result"):"Next question"}</button></div>
    </div>`;
    const btns=V.querySelectorAll(".opt");
    function lock(){btns.forEach(b=>{b.disabled=true;if(b.dataset.o===q.w)b.classList.add("right");else if(b.dataset.o===q.pick)b.classList.add("wrong")});
      const fb=$("#fb");fb.className="fb show "+(q.pick===q.w?"ok":"no");
      fb.innerHTML=(q.pick===q.w?"<b>Correct.</b> ":`<b>Not this time.</b> The answer is <b>${q.w}</b>. `)+`In the reading: “…${x.ex}…” <span class="ar" lang="ar">${x.ar}</span>`;
      $("#hint").style.display="none";}
    if(q.pick) {lock();if(q.hint)$("#hintTxt").classList.add("show")}
    if(q.hint) $("#hintTxt").classList.add("show");
    btns.forEach(b=>b.onclick=()=>{if(q.pick)return;q.pick=b.dataset.o;setNotes();
      if(key==="r2"){V.querySelector(".gap").textContent=q.pick}
      lock();});
    $("#hint").onclick=()=>{if(q.pick)return;q.hint=true;$("#hintTxt").classList.add("show")};
    $("#prev").onclick=()=>{if(key==="r1")S.i1--;else S.i2--;render()};
    $("#next").onclick=()=>{
      if(!q.pick){toast("Choose an answer first.");return}
      if(idx<list.length-1){if(key==="r1")S.i1++;else S.i2++;render()}
      else go(key==="r1"?"r2":"end");
    };
    return;
  }
  if(view==="end"){
    const sc=score(),tot=24,done=S.r1.concat(S.r2).filter(q=>q.pick).length,pass=sc>=Math.ceil(tot*0.8);
    const missed=[...new Set(S.r1.concat(S.r2).filter(q=>q.pick&&q.pick!==q.w).map(q=>q.w))];
    V.innerHTML=`<h2>My result</h2>
    <div class="panel result">
      <p class="big">${sc} / ${tot}</p>
      <p class="lead">${done<tot?`You have answered ${done} of ${tot} questions. Finish both rounds to get your certificate.`:pass?"Excellent. You earned the certificate.":"You need 20 / 24 for the certificate. Study the words below and try again."}</p>
      ${missed.length?`<p><b>Words to review:</b> ${missed.map(w=>`${w} <span lang="ar" style="font-family:var(--ar)">(${byW[w].ar})</span>`).join(", ")}</p>`:""}
      ${pass&&done===tot?`<div class="noprint"><label for="nm">Your name for the certificate</label><br><input type="text" id="nm" value="${S.name.replace(/"/g,"&quot;")}" placeholder="Type your name"></div>
      <div class="cert" id="cert"><div class="seal">${S.notes}<br>notes</div><h3>Certificate of Achievement</h3>
      <div>This certifies that</div><div class="who" id="who">${S.name||"Your name"}</div>
      <div>has mastered the 12 key words of <b>Vocab List 6</b> for the reading <i>A Business Between Classes</i>, scoring ${sc} / ${tot}.</div>
      <div class="sig">Designed by: Nazila Motahari · Higher Colleges of Technology</div></div>`:""}
      <div class="row">
        ${pass&&done===tot?`<button class="btn" id="print">Print / save certificate as PDF</button>`:""}
        <button class="btn ghost" id="save">Save my progress (.json)</button>
        <label class="btn ghost" style="display:inline-block">Load progress<input type="file" id="load" accept=".json" hidden></label>
        <button class="btn ghost" id="again">Start again</button>
      </div>
    </div>`;
    if($("#nm")) $("#nm").oninput=e=>{S.name=e.target.value;$("#who").textContent=S.name||"Your name"};
    if($("#print")) $("#print").onclick=()=>window.print();
    $("#save").onclick=save;
    $("#load").onchange=load;
    $("#again").onclick=()=>{
      const r=$("#again");
      if(r.dataset.sure){S=build();setNotes();go("study");return}
      r.dataset.sure="1";r.textContent="Tap again to clear everything";
    };
    if(pass&&done===tot&&!S.celebrated){S.celebrated=true;confetti()}
  }
}
function save(){
  const blob=new Blob([JSON.stringify({app:"word-warm-up-list6",v:1,S},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="word-warm-up-progress.json";a.click();toast("Progress saved to your downloads.");
}
function load(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=="word-warm-up-list6")throw 0;S=d.S;setNotes();toast("Progress loaded.");go("end")}catch(_){toast("That file is not a Word Warm-up save file.")}};
  r.readAsText(f);
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#8C2F39","#BFE3D0","#F4B400","#FFFFFF"];
  const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,w:16,h:9,vy:2+Math.random()*3,vx:-1+Math.random()*2,r:Math.random()*6,vr:-.1+Math.random()*.2,c:cols[Math.floor(Math.random()*4)]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.strokeStyle="#6A2029";x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.strokeRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(++t<240)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
go("study");
</script>
</body>
</html>
